<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareConnect - Create Account</title>
<script src="vendor/tailwind-play.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Public+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="vendor/supabase-js.umd.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<style>
  body{font-family:'Public Sans',sans-serif}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  .strength-bar{height:4px;border-radius:9999px;transition:all .3s}
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center px-4 py-8">

<div class="w-full max-w-md">

  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-900 rounded-2xl mb-4 shadow-lg">
      <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1">health_and_safety</span>
    </div>
    <h1 class="text-2xl font-bold text-blue-900">CareConnect</h1>
    <p class="text-slate-500 text-sm mt-1">Create your free account</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-3xl shadow-xl p-8 space-y-5">

    <h2 class="text-xl font-bold text-slate-800">Join CareConnect</h2>

    <!-- Error / Success banners -->
    <div id="errorBanner" class="hidden bg-red-50 border border-red-200 rounded-xl px-4 py-3 flex items-start gap-3">
      <span class="material-symbols-outlined text-red-500 text-sm mt-0.5" style="font-variation-settings:'FILL' 1">error</span>
      <p id="errorText" class="text-sm text-red-700"></p>
    </div>

    <form id="signupForm" class="space-y-4" onsubmit="handleSignup(event)">

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
        <input id="fullName" type="text" required autocomplete="name"
          placeholder="Alex Johnson"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-900/30 focus:border-blue-900 transition-all"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
        <input id="email" type="email" required autocomplete="email"
          placeholder="you@example.com"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-900/30 focus:border-blue-900 transition-all"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
        <div class="relative">
          <input id="password" type="password" required autocomplete="new-password"
            placeholder="At least 8 characters"
            oninput="checkStrength(this.value)"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-900/30 focus:border-blue-900 transition-all pr-12"/>
          <button type="button" onclick="togglePwd('password','eye1')"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <span id="eye1" class="material-symbols-outlined text-xl">visibility</span>
          </button>
        </div>
        <!-- Strength indicator -->
        <div class="mt-2 space-y-1">
          <div class="flex gap-1">
            <div id="s1" class="strength-bar flex-1 bg-slate-100"></div>
            <div id="s2" class="strength-bar flex-1 bg-slate-100"></div>
            <div id="s3" class="strength-bar flex-1 bg-slate-100"></div>
            <div id="s4" class="strength-bar flex-1 bg-slate-100"></div>
          </div>
          <p id="strengthLabel" class="text-xs text-slate-400"></p>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirm Password</label>
        <div class="relative">
          <input id="confirmPassword" type="password" required autocomplete="new-password"
            placeholder="Repeat password"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-900/30 focus:border-blue-900 transition-all pr-12"/>
          <button type="button" onclick="togglePwd('confirmPassword','eye2')"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <span id="eye2" class="material-symbols-outlined text-xl">visibility</span>
          </button>
        </div>
      </div>

      <!-- Terms -->
      <div class="flex items-start gap-3">
        <input id="terms" type="checkbox" required class="mt-0.5 w-4 h-4 rounded border-slate-300 text-blue-900"/>
        <label for="terms" class="text-xs text-slate-500">
          I agree to the <a href="#" class="text-blue-700 hover:underline">Terms of Service</a> and
          <a href="#" class="text-blue-700 hover:underline">Privacy Policy</a>.
          Your health data is encrypted and HIPAA-protected.
        </label>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-blue-900 text-white font-semibold py-3.5 rounded-xl hover:bg-blue-800 active:scale-95 transition-all flex items-center justify-center gap-2">
        <span id="btnText">Create Account</span>
        <span id="btnSpinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
      </button>
    </form>

    <p class="text-center text-sm text-slate-500">
      Already have an account?
      <a href="login.html" class="text-blue-700 font-semibold hover:underline">Sign in</a>
    </p>

  </div>

  <p class="text-center text-xs text-slate-400 mt-6">
    Protected by Supabase Auth · HIPAA-aligned encryption
  </p>
</div>

<script>
getSession().then(s => { if (s) window.location.href = 'index.html'; });

function togglePwd(id, iconId) {
  const el = document.getElementById(id);
  const icon = document.getElementById(iconId);
  const hide = el.type === 'password';
  el.type = hide ? 'text' : 'password';
  icon.textContent = hide ? 'visibility_off' : 'visibility';
}

function checkStrength(val) {
  const bars = [document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3'),document.getElementById('s4')];
  const label = document.getElementById('strengthLabel');
  const colors = ['bg-slate-100','bg-slate-100','bg-slate-100','bg-slate-100'];
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  const fills = ['bg-red-400','bg-orange-400','bg-yellow-400','bg-green-500'];
  const labels = ['','Weak','Fair','Good','Strong'];
  const textColors = ['','text-red-500','text-orange-500','text-yellow-600','text-green-600'];

  bars.forEach((b, i) => { b.className = `strength-bar flex-1 ${i < score ? fills[score-1] : 'bg-slate-100'}`; });
  label.textContent = labels[score] || '';
  label.className = `text-xs ${textColors[score] || 'text-slate-400'}`;
}

function setLoading(loading) {
  document.getElementById('submitBtn').disabled = loading;
  document.getElementById('btnSpinner').classList.toggle('hidden', !loading);
  document.getElementById('btnText').textContent = loading ? 'Creating account...' : 'Create Account';
}

function showError(msg) {
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorBanner').classList.remove('hidden');
}

async function handleSignup(e) {
  e.preventDefault();
  const fullName = document.getElementById('fullName').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirmPassword').value;

  if (password !== confirm) { showError('Passwords do not match.'); return; }
  if (password.length < 8)  { showError('Password must be at least 8 characters.'); return; }

  setLoading(true);
  document.getElementById('errorBanner').classList.add('hidden');

  const { data, error } = await signUp(email, password, fullName);

  setLoading(false);

  if (error) {
    if (error.message.includes('already registered')) {
      showError('An account with this email already exists. Try signing in.');
    } else {
      showError(error.message);
    }
    return;
  }

  // Store email for verify page
  sessionStorage.setItem('pendingEmail', email);
  window.location.href = 'verify.html';
}
</script>
</body>
</html>
