<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareConnect - Reset Password</title>
<script src="vendor/tailwind-play.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="vendor/supabase-js.umd.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<style>body{font-family:'Public Sans',sans-serif}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center px-4">

<div class="w-full max-w-md">

  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-900 rounded-2xl mb-4 shadow-lg">
      <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1">lock_reset</span>
    </div>
    <h1 class="text-2xl font-bold text-blue-900">Set New Password</h1>
    <p class="text-slate-500 text-sm mt-1">Choose a strong password for your account</p>
  </div>

  <div class="bg-white rounded-3xl shadow-xl p-8 space-y-5">

    <div id="errorBanner" class="hidden bg-red-50 border border-red-200 rounded-xl px-4 py-3">
      <p id="errorText" class="text-sm text-red-700"></p>
    </div>

    <form onsubmit="handleReset(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">New Password</label>
        <div class="relative">
          <input id="newPassword" type="password" required placeholder="At least 8 characters"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-900/30 focus:border-blue-900 transition-all pr-12"/>
          <button type="button" onclick="toggle('newPassword','e1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
            <span id="e1" class="material-symbols-outlined text-xl">visibility</span>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirm Password</label>
        <div class="relative">
          <input id="confirmPassword" type="password" required placeholder="Repeat password"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-900/30 focus:border-blue-900 transition-all pr-12"/>
          <button type="button" onclick="toggle('confirmPassword','e2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
            <span id="e2" class="material-symbols-outlined text-xl">visibility</span>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-blue-900 text-white font-semibold py-3.5 rounded-xl hover:bg-blue-800 active:scale-95 transition-all flex items-center justify-center gap-2">
        <span id="btnText">Update Password</span>
        <span id="spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
      </button>
    </form>

  </div>
</div>

<script>
function toggle(id, iconId) {
  const el = document.getElementById(id);
  const icon = document.getElementById(iconId);
  const hide = el.type === 'password';
  el.type = hide ? 'text' : 'password';
  icon.textContent = hide ? 'visibility_off' : 'visibility';
}

async function handleReset(e) {
  e.preventDefault();
  const pw  = document.getElementById('newPassword').value;
  const cpw = document.getElementById('confirmPassword').value;

  if (pw !== cpw) {
    document.getElementById('errorText').textContent = 'Passwords do not match.';
    document.getElementById('errorBanner').classList.remove('hidden');
    return;
  }
  if (pw.length < 8) {
    document.getElementById('errorText').textContent = 'Password must be at least 8 characters.';
    document.getElementById('errorBanner').classList.remove('hidden');
    return;
  }

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('spinner').classList.remove('hidden');
  document.getElementById('btnText').textContent = 'Updating...';
  document.getElementById('errorBanner').classList.add('hidden');

  const { error } = await updatePassword(pw);

  if (error) {
    document.getElementById('errorText').textContent = error.message;
    document.getElementById('errorBanner').classList.remove('hidden');
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('spinner').classList.add('hidden');
    document.getElementById('btnText').textContent = 'Update Password';
    return;
  }

  alert('Password updated! Redirecting to your dashboard.');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
