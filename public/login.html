<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareConnect - Sign In</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Public+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/auth.js"></script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  body{font-family:'Public Sans',sans-serif}
  input:focus{outline:none;ring:2px solid #003c90}
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center px-4">

<div class="w-full max-w-md">

  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-900 rounded-2xl mb-4 shadow-lg">
      <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1">health_and_safety</span>
    </div>
    <h1 class="text-2xl font-bold text-blue-900">CareConnect</h1>
    <p class="text-slate-500 text-sm mt-1">Sign in to your health dashboard</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-3xl shadow-xl p-8 space-y-5">

    <h2 class="text-xl font-bold text-slate-800">Welcome back</h2>

    <!-- Error banner -->
    <div id="errorBanner" class="hidden bg-red-50 border border-red-200 rounded-xl px-4 py-3 flex items-start gap-3">
      <span class="material-symbols-outlined text-red-500 text-sm mt-0.5" style="font-variation-settings:'FILL' 1">error</span>
      <p id="errorText" class="text-sm text-red-700"></p>
    </div>

    <!-- Success banner -->
    <div id="successBanner" class="hidden bg-green-50 border border-green-200 rounded-xl px-4 py-3">
      <p id="successText" class="text-sm text-green-700"></p>
    </div>

    <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
        <input id="email" type="email" required autocomplete="email"
          placeholder="you@example.com"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-900/30 focus:border-blue-900 transition-all"/>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-sm font-medium text-slate-700">Password</label>
          <button type="button" onclick="showForgotPassword()" class="text-xs text-blue-700 hover:underline">Forgot password?</button>
        </div>
        <div class="relative">
          <input id="password" type="password" required autocomplete="current-password"
            placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-900/30 focus:border-blue-900 transition-all pr-12"/>
          <button type="button" onclick="togglePassword('password','eyeBtn')" id="eyeBtn"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <span class="material-symbols-outlined text-xl">visibility</span>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-blue-900 text-white font-semibold py-3.5 rounded-xl hover:bg-blue-800 active:scale-95 transition-all flex items-center justify-center gap-2">
        <span id="btnText">Sign In</span>
        <span id="btnSpinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
      </button>
    </form>

    <div class="relative">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div>
      <div class="relative text-center"><span class="bg-white px-3 text-xs text-slate-400">OR</span></div>
    </div>

    <p class="text-center text-sm text-slate-500">
      Don't have an account?
      <a href="signup.html" class="text-blue-700 font-semibold hover:underline">Create one</a>
    </p>

  </div>

  <p class="text-center text-xs text-slate-400 mt-6">
    Protected by Supabase Auth · HIPAA-aligned encryption
  </p>
</div>

<!-- Forgot Password Modal -->
<div id="forgotModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl w-full max-w-sm p-6 space-y-4">
    <div class="flex justify-between items-center">
      <h2 class="font-bold text-lg">Reset Password</h2>
      <button onclick="document.getElementById('forgotModal').classList.add('hidden')" class="text-slate-400">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <p class="text-sm text-slate-500">Enter your email and we'll send you a reset link.</p>
    <input id="resetEmail" type="email" placeholder="you@example.com"
      class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-900/30 focus:border-blue-900"/>
    <button onclick="handleForgotPassword()"
      class="w-full bg-blue-900 text-white font-semibold py-3 rounded-xl hover:bg-blue-800 transition-colors">
      Send Reset Link
    </button>
  </div>
</div>

<script>
// Redirect if already logged in
getSession().then(session => {
  if (session) window.location.href = 'index.html';
});

function showError(msg) {
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorBanner').classList.remove('hidden');
  document.getElementById('successBanner').classList.add('hidden');
}

function showSuccess(msg) {
  document.getElementById('successText').textContent = msg;
  document.getElementById('successBanner').classList.remove('hidden');
  document.getElementById('errorBanner').classList.add('hidden');
}

function setLoading(loading) {
  document.getElementById('submitBtn').disabled = loading;
  document.getElementById('btnSpinner').classList.toggle('hidden', !loading);
  document.getElementById('btnText').textContent = loading ? 'Signing in...' : 'Sign In';
}

function togglePassword(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.querySelector('span').textContent = isHidden ? 'visibility_off' : 'visibility';
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  setLoading(true);
  document.getElementById('errorBanner').classList.add('hidden');

  const { data, error } = await signIn(email, password);

  setLoading(false);

  if (error) {
    if (error.message.includes('Email not confirmed')) {
      showError('Please verify your email first. Check your inbox for a confirmation link.');
    } else if (error.message.includes('Invalid login')) {
      showError('Incorrect email or password.');
    } else {
      showError(error.message);
    }
    return;
  }

  // Redirect to originally requested page or home
  const next = new URLSearchParams(location.search).get('next') || 'index.html';
  window.location.href = next;
}

function showForgotPassword() {
  document.getElementById('resetEmail').value = document.getElementById('email').value;
  document.getElementById('forgotModal').classList.remove('hidden');
}

async function handleForgotPassword() {
  const email = document.getElementById('resetEmail').value.trim();
  if (!email) { alert('Please enter your email.'); return; }

  const { error } = await sendPasswordReset(email);
  document.getElementById('forgotModal').classList.add('hidden');

  if (error) {
    showError('Could not send reset email: ' + error.message);
  } else {
    showSuccess('Password reset link sent! Check your inbox.');
  }
}
</script>
</body>
</html>
